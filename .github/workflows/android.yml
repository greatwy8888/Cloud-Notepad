name: Android APK
on:
  push:
    branches: [ "yi-document-v1" ]
  workflow_dispatch:
    inputs:
      release_signing:
        description: "Build release APK with the saved fixed signing key (requires repository secrets)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Decode fixed release signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_signing }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yi-document-release.jks"
      - name: Build fixed-signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_signing }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yi-document-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload fixed-signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_signing }}
        uses: actions/upload-artifact@v4
        with:
          name: YiDocument-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YiDocument-v1.0.7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
