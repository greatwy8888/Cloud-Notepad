name: Android APK
on:
  push:
    branches: [ "yi-document-v1" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Decode fixed release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yi-document-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/yi-document-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
      - name: Build fixed-signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yi-document-release.jks
        run: gradle assembleRelease
      - name: Verify fixed signing certificate
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -F "6C:4D:EC:96:00:5B:66:6F:45:04:15:C0:8D:84:4C:F8:C7:FA:82:42:68:EB:8A:15:04:1E:33:18:06:29:77:22"
      - name: Upload fixed-signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: YiDocument-v1.0.8-fixed-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YiDocument-v1.0.8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
