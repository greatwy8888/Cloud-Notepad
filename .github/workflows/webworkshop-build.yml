name: WebWorkshop Android Build

concurrency:
  group: webworkshop-build-v2-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'webworkshop/**'
      - '.github/workflows/webworkshop-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anirudhmalik/apktool-android
          ref: v1.0.0
          path: vendor/apktool-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Prepare offline APK repackaging engine
        working-directory: vendor/apktool-android
        run: |
          # The Android AAR is downloaded from the tagged release below; only resolve/copy its runtime jars.
          sed -i 's/dependsOn("assembleRelease")/\/\/ prebuilt AAR is used/' brut.apktool/apktool-android/build.gradle.kts
          timeout 600s gradle --no-daemon --console=plain :brut.apktool:apktool-android:collectRuntimeJars --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/runtime"
          mkdir -p "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool"
          curl -L "https://github.com/anirudhmalik/apktool-android/releases/download/v1.0.0/apktool-android-1.0.0.aar" -o "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/apktool-android-1.0.0.aar"
          cp brut.apktool/apktool-android/build/libs-bundle/*.jar "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/runtime/"
          rm -f "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/runtime/listenablefuture-1.0.jar"
          # Bouncy Castle is supplied by Gradle dependencies to avoid duplicate classes.
          rm -f "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/runtime/"bcprov*.jar
          rm -f "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/runtime/"bcpkix*.jar
          rm -f "$GITHUB_WORKSPACE/webworkshop/app/libs/apktool/runtime/"bcutil*.jar
      - name: Configure persistent release signing
        env:
          WEBWORKSHOP_RELEASE_KEYSTORE_BASE64: ${{ secrets.WEBWORKSHOP_RELEASE_KEYSTORE_BASE64 }}
          WEBWORKSHOP_RELEASE_STORE_PASSWORD: ${{ secrets.WEBWORKSHOP_RELEASE_STORE_PASSWORD }}
          WEBWORKSHOP_RELEASE_KEY_ALIAS: ${{ secrets.WEBWORKSHOP_RELEASE_KEY_ALIAS }}
          WEBWORKSHOP_RELEASE_KEY_PASSWORD: ${{ secrets.WEBWORKSHOP_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$WEBWORKSHOP_RELEASE_KEYSTORE_BASE64" ] && [ -n "$WEBWORKSHOP_RELEASE_STORE_PASSWORD" ] && [ -n "$WEBWORKSHOP_RELEASE_KEY_ALIAS" ] && [ -n "$WEBWORKSHOP_RELEASE_KEY_PASSWORD" ]; then
            echo "$WEBWORKSHOP_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/webworkshop-release.jks"
            echo "WEBWORKSHOP_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/webworkshop-release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Persistent signing secrets are not configured; building a non-upgradeable debug preview."
          fi
      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: webworkshop
        env:
          WEBWORKSHOP_RELEASE_STORE_PASSWORD: ${{ secrets.WEBWORKSHOP_RELEASE_STORE_PASSWORD }}
          WEBWORKSHOP_RELEASE_KEY_ALIAS: ${{ secrets.WEBWORKSHOP_RELEASE_KEY_ALIAS }}
          WEBWORKSHOP_RELEASE_KEY_PASSWORD: ${{ secrets.WEBWORKSHOP_RELEASE_KEY_PASSWORD }}
        run: timeout 1200s gradle --no-daemon --console=plain :template:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify release APK signature
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose webworkshop/app/build/outputs/apk/release/app-release.apk
      - name: Build debug preview (not upgradeable)
        if: env.HAS_RELEASE_SIGNING != 'true'
        working-directory: webworkshop
        run: timeout 1200s gradle --no-daemon --console=plain :template:assembleDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING == 'true'
        with:
          name: webworkshop-release-apk
          path: webworkshop/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING != 'true'
        with:
          name: webworkshop-debug-preview-not-upgradeable
          path: webworkshop/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

