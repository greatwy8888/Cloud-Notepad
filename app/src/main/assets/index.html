<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"><title>King Yi 编辑器</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#eef2f7;color:#1a2a3a;font-family:system-ui}body.dark{background:#0f172a;color:#e2e8f0}.bar{padding:7px;background:inherit;box-shadow:0 1px 3px #8885}.row{display:flex;gap:5px;overflow:auto;padding:3px 0;align-items:center}.btn,input,select{border:1px solid #b8c4d3;border-radius:20px;padding:8px 11px;background:white;color:#233;font-size:12px;white-space:nowrap}.btn{cursor:pointer;font-weight:650}.primary{background:#2563eb;color:white}.danger{background:#dc2626;color:white}.name{flex:1;min-width:90px}.edit{flex:1;min-height:0;margin:6px;padding:12px;background:white;border:2px solid #cbd5e1;overflow:auto;outline:0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.edit img{max-width:95%;height:auto;display:block;margin:8px auto}.overlay{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;padding:20px}.login{width:100%;max-width:360px;background:white;color:#223;padding:25px;border-radius:18px;text-align:center}.login input{width:100%;margin:7px 0;padding:12px}.login button{width:100%;padding:13px;background:#526ee8;color:white;border:0;border-radius:22px}.hidden{display:none!important}.panel{position:fixed;right:8px;top:80px;max-height:65vh;overflow:auto;background:white;color:#223;box-shadow:0 5px 25px #0004;padding:8px;display:none}.item{display:flex;gap:8px;padding:8px;border-bottom:1px solid #ddd}.item span{flex:1}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#059669;color:white;border-radius:18px;padding:8px;display:none}
</style></head><body><div id="auth" class="overlay"><div class="login"><h2>✍️ King Yi 编辑器</h2><p id="tip">首次使用，请设置本机访问密码。密码不会写入程序代码。</p><input id="pw" type="password" placeholder="访问密码" autocomplete="new-password"><input id="pw2" type="password" placeholder="再次输入密码"><button id="authBtn">设置密码并进入</button><p id="err"></p></div></div><header class="bar hidden" id="bar"><div class="row"><b>✍️ King Yi 编辑器</b><button class="btn" id="dark">🌙</button><button class="btn" id="change">🔐 修改密码</button><button class="btn danger" id="lock">锁定</button></div><div class="row"><input id="fname" class="name" placeholder="文件名"><select id="fmt"><option value="html">HTML</option><option value="txt">TXT</option></select><button class="btn primary" id="save">保存</button><button class="btn" id="export">另存</button><button class="btn" id="open">打开</button><button class="btn" id="new">新建</button><button class="btn" id="files">文件</button></div><div class="row"><button class="btn" id="undo">撤销</button><button class="btn" id="redo">恢复</button><button class="btn" data-cmd="bold"><b>粗体</b></button><button class="btn" data-cmd="justifyLeft">左</button><button class="btn" data-cmd="justifyCenter">中</button><button class="btn" id="img">图片</button><button class="btn" id="print">打印/PDF</button></div></header><div id="panel" class="panel"></div><main id="editor" class="edit hidden" contenteditable="true"></main><div id="toast" class="toast"></div><div id="fileModal" class="overlay hidden"><div class="login"><h3>修改访问密码</h3><input id="old" type="password" placeholder="原密码"><input id="next" type="password" placeholder="新密码"><input id="next2" type="password" placeholder="再次输入新密码"><button id="apply">确认修改</button><button id="cancel" style="margin-top:8px">取消</button></div></div><input id="pick" type="file" hidden accept=".html,.htm,.txt,.php,.js,.css,.json,.xml"><input id="pic" type="file" hidden accept="image/*"><div id="msg" class="toast"></div><script>
const $=x=>document.getElementById(x),HK='ky_hash_v1',SK='ky_salt_v1',DK='ky_docs_v1';let hs=[],hp=-1;
function say(s){$('msg').textContent=s;$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',1800)}
function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a)))}function un64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function hash(p,s){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:s,iterations:310000,hash:'SHA-256'},k,256))}
async function valid(p){let s=localStorage.getItem(SK),h=localStorage.getItem(HK);return !!s&&!!h&&(await hash(p,un64(s)))===h}
function docs(){try{return JSON.parse(localStorage.getItem(DK)||'{}')}catch(e){return {}}}function saveDocs(d){try{localStorage.setItem(DK,JSON.stringify(d));return true}catch(e){say('空间不足，请减少图片大小');return false}}
function snap(){let v=$('editor').innerHTML;if(hs[hp]===v)return;hs=hs.slice(0,hp+1);hs.push(v);if(hs.length>20)hs.shift();hp=hs.length-1}
function restore(i){if(i>=0&&i<hs.length){hp=i;$('editor').innerHTML=hs[i]}}
async function auth(){let p=$('pw').value,p2=$('pw2').value;$('err').textContent='';if(!p)return $('err').textContent='请输入密码';if(!localStorage.getItem(HK)){if(p.length<6)return $('err').textContent='密码至少6位';if(p!==p2)return $('err').textContent='两次密码不一致';let s=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem(SK,b64(s));localStorage.setItem(HK,await hash(p,s))}else if(!(await valid(p)))return $('err').textContent='密码错误';$('pw').value=$('pw2').value='';$('auth').classList.add('hidden');$('bar').classList.remove('hidden');$('editor').classList.remove('hidden');snap()}
$('authBtn').onclick=auth;$('pw').onkeydown=e=>{if(e.key==='Enter')auth()};let first=!localStorage.getItem(HK);$('pw2').classList.toggle('hidden',!first);$('tip').textContent=first?'首次使用，请设置本机密码。不会在源代码中预置密码。':'请输入访问密码';$('authBtn').textContent=first?'设置密码并进入':'解锁';
$('save').onclick=()=>{let n=($('fname').value||'未命名').trim().replace(/[\\/:*?"<>|]/g,'_'),e=$('fmt').value,d=docs();d[n+'.'+e]={content:$('editor').innerHTML,ext:e,time:Date.now()};if(saveDocs(d))say('已保存：'+n+'.'+e)};
$('files').onclick=()=>{let p=$('panel');p.innerHTML='';Object.keys(docs()).sort((a,b)=>docs()[b].time-docs()[a].time).forEach(n=>{let r=document.createElement('div');r.className='item';let s=document.createElement('span');s.textContent=n;s.onclick=()=>{let x=docs()[n];$('editor').innerHTML=x.content;$('fname').value=n.replace(/\.[^.]+$/,'');$('fmt').value=x.ext;hs=[];hp=-1;snap();p.style.display='none'};let d=document.createElement('button');d.textContent='删除';d.onclick=()=>{let x=docs();delete x[n];saveDocs(x);r.remove()};r.append(s,d);p.append(r)});p.style.display=p.style.display==='block'?'none':'block'};
$('export').onclick=()=>{let n=$('fname').value||'未命名',e=$('fmt').value;let c=$('editor').innerHTML;if(e==='txt'){let z=document.createElement('div');z.innerHTML=c;c=z.innerText}else c='<!doctype html><meta charset="utf-8"><body>'+c+'</body>';let u=URL.createObjectURL(new Blob([c],{type:e==='txt'?'text/plain':'text/html'})),a=document.createElement('a');a.href=u;a.download=n+'.'+e;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('open').onclick=()=>$('pick').click();$('pick').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{if(f.name.toLowerCase().endsWith('.txt')){let pre=document.createElement('pre');pre.textContent=r.result;$('editor').replaceChildren(pre);$('fmt').value='txt'}else{$('editor').innerHTML=r.result;$('fmt').value='html'}$('fname').value=f.name.replace(/\.[^.]+$/,'');snap()};r.readAsText(f);e.target.value=''};
$('new').onclick=()=>{if(confirm('新建空白文档？')){$('editor').innerHTML='';$('fname').value='';snap()}};$('img').onclick=()=>$('pic').click();$('pic').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return say('图片不能超过4MB');let r=new FileReader();r.onload=()=>{document.execCommand('insertImage',false,r.result);snap()};r.readAsDataURL(f);e.target.value=''};
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,null);snap()});$('undo').onclick=()=>restore(hp-1);$('redo').onclick=()=>restore(hp+1);$('editor').addEventListener('input',()=>{clearTimeout(window.t);window.t=setTimeout(snap,400)});$('dark').onclick=()=>document.body.classList.toggle('dark');$('print').onclick=()=>window.print();
$('lock').onclick=()=>{location.reload()};$('change').onclick=()=>$('fileModal').classList.remove('hidden');$('cancel').onclick=()=>$('fileModal').classList.add('hidden');$('apply').onclick=async()=>{let a=$('old').value,b=$('next').value,c=$('next2').value;if(!(await valid(a)))return say('原密码错误');if(b.length<6||b!==c)return say('新密码至少6位且两次一致');let s=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem(SK,b64(s));localStorage.setItem(HK,await hash(b,s));$('fileModal').classList.add('hidden');say('密码修改成功')};
window.handleAndroidBack=()=>{if($('panel').style.display==='block'){$('panel').style.display='none';return}if(!$('fileModal').classList.contains('hidden')){$('fileModal').classList.add('hidden');return}if(confirm('确定锁定编辑器？'))location.reload()};
</script></body></html>
